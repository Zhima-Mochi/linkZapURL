name: Go CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Run golint
      run: |
        go install golang.org/x/lint/golint@latest
        golint ./...

    - name: Run tests
      run: go test ./...
